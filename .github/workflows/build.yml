name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -q climamdz-android.zip -d proyecto
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        working-directory: proyecto
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Clima MDZ APK ${{ github.run_number }}
          files: proyecto/app/build/outputs/apk/release/app-release.apk
          
